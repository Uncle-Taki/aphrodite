basePath: /
definitions:
  comment_transport_http.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  content_transport_http.ErrorResponse:
    properties:
      error:
        example: content not found
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      postgres:
        example: up
        type: string
      redis:
        example: up
        type: string
      status:
        example: healthy
        type: string
    type: object
  http.AddCommentRequest:
    properties:
      content:
        example: Great post!
        type: string
    required:
    - content
    type: object
  http.AdminUpdateUserRequest:
    properties:
      disabled:
        example: false
        type: boolean
      email:
        example: alice@example.com
        type: string
      phone_number:
        example: "+15551234567"
        type: string
      role:
        enum:
        - user
        - admin
        - editor
        example: user
        type: string
      username:
        example: alice
        type: string
    required:
    - email
    - username
    type: object
  http.AuthenticateRequest:
    properties:
      identifier:
        example: alice
        type: string
      password:
        example: correct-horse-battery-staple
        type: string
    required:
    - identifier
    - password
    type: object
  http.AuthenticateResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/http.UserResponse'
    type: object
  http.ChangePasswordRequest:
    properties:
      current_password:
        example: correct-horse-battery-staple
        type: string
      new_password:
        example: new-correct-horse-battery-staple
        type: string
    required:
    - current_password
    - new_password
    type: object
  http.CommentListResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/http.CommentResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  http.CommentResponse:
    properties:
      author_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      post_id:
        type: string
      updated_at:
        type: string
    type: object
  http.ContentListResponse:
    properties:
      items:
        items: {}
        type: array
      limit:
        example: 15
        type: integer
      page:
        example: 1
        type: integer
      page_count:
        example: 3
        type: integer
      total:
        example: 42
        type: integer
    type: object
  http.CreatePostRequest:
    properties:
      content:
        example: This is my first post.
        type: string
      title:
        example: Hello, world
        type: string
    required:
    - content
    - title
    type: object
  http.PostListResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      posts:
        items:
          $ref: '#/definitions/http.PostResponse'
        type: array
      total:
        type: integer
    type: object
  http.PostResponse:
    properties:
      author_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  http.RegisterRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      password:
        example: correct-horse-battery-staple
        type: string
      phone_number:
        example: "+15551234567"
        type: string
      role:
        enum:
        - user
        - admin
        - editor
        example: user
        type: string
      super_admin_key:
        example: bootstrap-secret
        type: string
      username:
        example: alice
        type: string
    required:
    - email
    - password
    - username
    type: object
  http.UpdateCommentRequest:
    properties:
      content:
        example: Updated comment.
        type: string
    required:
    - content
    type: object
  http.UpdateMeRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      phone_number:
        example: "+15551234567"
        type: string
      username:
        example: alice
        type: string
    required:
    - email
    - username
    type: object
  http.UpdatePostRequest:
    properties:
      content:
        example: Updated post content.
        type: string
      title:
        example: Updated title
        type: string
    required:
    - content
    - title
    type: object
  http.UserListResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/http.UserResponse'
        type: array
    type: object
  http.UserResponse:
    properties:
      created_at:
        type: string
      disabled:
        type: boolean
      email:
        type: string
      id:
        type: string
      phone_number:
        type: string
      role:
        enum:
        - user
        - admin
        - editor
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  post_transport_http.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  user_transport_http.ErrorResponse:
    properties:
      error:
        type: string
    type: object
